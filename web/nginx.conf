# Serves the built client and forwards the API, so the browser talks to one
# origin: no CORS, and the bearer token never leaves it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Invoice PDFs and JSON bodies stay small; anything larger is a mistake.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080;
    }

    # Hashed file names: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/customers/…, /invoices/…) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

name: Scaffold
on:
  push:
    branches: ['scaffold/**']
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build AutoFlow.slnx -c Release
      - name: Write OpenAPI snapshot
        run: AUTOFLOW_UPDATE_OPENAPI=1 dotnet test tests/AutoFlow.Api.Tests -c Release --no-build --filter "FullyQualifiedName~OpenApiSnapshotTests" || true
      - name: Dump
        run: |
          ls -la web
          gzip -c web/openapi.json | base64 -w0 > m.b64
          echo "BEGIN_B64"
          fold -w 4000 m.b64
          echo
          echo "END_B64"
